
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>7 Print Design | Personalização</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #171717;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 28px 7%;
      border-bottom: 1px solid #333;
      font-weight: bold;
      letter-spacing: 2px;
    }
    main {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 10%;
    }
    h1 {
      font-size: clamp(42px, 8vw, 88px);
      line-height: 1.05;
      margin: 0;
    }
    h1 span { color: #e3262e; }
    p {
      color: #ccc;
      font-size: 19px;
      line-height: 1.6;
      max-width: 580px;
    }
    footer {
      padding: 25px 7%;
      color: #aaa;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <header>7 PRINT DESIGN</header>
  <main>
    <h1>SUA IDEIA.<br><span>NOSSA CRIAÇÃO.</span><br>SEU ESTILO.</h1>
    <p>Personalização que transforma ideias em produtos únicos.</p>
    <p>Vestuário • Personalizados • Linha religiosa</p>
  </main>
  <footer>7 Print Design — Criatividade e personalização.</footer>
</body>
</html>
